<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to AnyLM</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9; color: #16181d;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #16181d; color: #e8eaed; }
        .card { background: #1f2229; border-color: #2c3038; }
        button { background: #2c3038; color: #e8eaed; border-color: #3a3f49; }
      }
      .card {
        width: min(380px, 90vw); padding: 32px; border-radius: 14px;
        background: #fff; border: 1px solid #e3e5e9; text-align: center;
      }
      h1 { font-size: 19px; margin: 0 0 6px; }
      p.sub { margin: 0 0 20px; opacity: .7; font-size: 14px; }
      button {
        width: 100%; padding: 11px 16px; margin-bottom: 10px; font-size: 15px;
        border-radius: 9px; border: 1px solid #d7dade; background: #fff;
        cursor: pointer;
      }
      button:hover { filter: brightness(.97); }
      .msg { font-size: 14px; min-height: 20px; }
      .err { color: #d33; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sign in to AnyLM</h1>
      <p class="sub" id="sub">Choose how you want to continue.</p>
      <div id="buttons">
        <button data-provider="google">Continue with Google</button>
        <button data-provider="github">Continue with GitHub</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <!-- Firebase Hosting serves both of these for the linked project, so the
         web config never has to be copied into this file. Hosting is free on
         the Spark plan, which is the whole reason this page still exists. -->
    <script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script>
      // WHY THIS PAGE EXISTS
      //
      // Firebase Auth's popup flow does not work in an Electron main process,
      // and Google refuses sign-in inside embedded webviews. So the app opens
      // the real system browser here and we complete the flow with the normal
      // web SDK.
      //
      // We use signInWithRedirect (not signInWithPopup). The desktop app opens
      // this page with ?provider=…, which would call the SDK immediately — and
      // browsers block popups that are not tied to a user gesture
      // (auth/popup-blocked). A top-level redirect is not subject to that.
      //
      // The SDK talks to Firebase's own hosted OAuth handler, which holds the
      // Google and GitHub client secrets inside the Firebase project. That is
      // what lets a distributed desktop app support both providers without
      // shipping a secret, and without a Cloud Function to mint tokens.
      //
      // The result comes back over a loopback port the app opened, not over
      // the anylm:// scheme. Any local application can register a URL scheme
      // and intercept the callback; only one process can hold a TCP port.
      //
      // Port is stashed in sessionStorage before the OAuth redirect, because
      // the return URL may not keep the original query string.
      var PORT_KEY = "anylm_oauth_port";
      var STARTED_KEY = "anylm_oauth_started";

      var msg = document.getElementById("msg");
      var buttons = document.getElementById("buttons");
      var params = new URLSearchParams(location.search);
      var port = params.get("port") || sessionStorage.getItem(PORT_KEY);

      if (params.get("port")) sessionStorage.setItem(PORT_KEY, params.get("port"));

      function say(text, isError) {
        msg.textContent = text;
        msg.className = isError ? "msg err" : "msg";
      }

      function providerFor(name) {
        if (name === "github") return new firebase.auth.GithubAuthProvider();
        var p = new firebase.auth.GoogleAuthProvider();
        p.setCustomParameters({ prompt: "select_account" });
        return p;
      }

      async function finish(cred) {
        // The refresh token is what the app needs; it trades it for a
        // session immediately and stores it in the OS keystore. Handing it
        // to a loopback port on the same machine is the standard native-app
        // pattern (RFC 8252).
        var refreshToken = cred.user.refreshToken;
        if (!refreshToken) throw new Error("No session was returned.");
        if (!port) throw new Error("Open this page from the AnyLM app so it can receive the result.");

        // Nothing should stay signed in in the browser afterwards.
        await firebase.auth().signOut();

        sessionStorage.removeItem(PORT_KEY);
        sessionStorage.removeItem(STARTED_KEY);

        say("Signed in. Returning to AnyLM...");
        location.href =
          "http://127.0.0.1:" + encodeURIComponent(port) +
          "/callback?refreshToken=" + encodeURIComponent(refreshToken);
      }

      async function startRedirect(name) {
        if (!port) {
          say("Open this page from the AnyLM app so it can receive the result.", true);
          return;
        }
        sessionStorage.setItem(PORT_KEY, port);
        sessionStorage.setItem(STARTED_KEY, "1");
        buttons.style.display = "none";
        say("Opening " + name + "...");
        await firebase.auth().signInWithRedirect(providerFor(name));
      }

      buttons.addEventListener("click", function (e) {
        var p = e.target.getAttribute("data-provider");
        if (p) startRedirect(p).catch(function (err) {
          buttons.style.display = "";
          sessionStorage.removeItem(STARTED_KEY);
          say(err.message || "Sign-in failed.", true);
        });
      });

      (async function boot() {
        try {
          var result = await firebase.auth().getRedirectResult();
          if (result && result.user) {
            buttons.style.display = "none";
            say("Signed in. Returning to AnyLM...");
            await finish(result);
            return;
          }
        } catch (e) {
          sessionStorage.removeItem(STARTED_KEY);
          say(e.message || "Sign-in failed.", true);
          return;
        }

        // Returned from the provider without a credential (cancel / deny).
        // Clear the flag so a later button click can try again; do not
        // immediately re-trigger redirect or we loop forever.
        if (sessionStorage.getItem(STARTED_KEY)) {
          sessionStorage.removeItem(STARTED_KEY);
          say("Sign-in was cancelled. Choose a provider to try again.", true);
          return;
        }

        // App deep-link: start the provider redirect without a popup.
        var wanted = params.get("provider");
        if (wanted === "google" || wanted === "github") {
          try {
            await startRedirect(wanted);
          } catch (e) {
            buttons.style.display = "";
            sessionStorage.removeItem(STARTED_KEY);
            say(e.message || "Sign-in failed.", true);
          }
        }
      })();
    </script>
  </body>
</html>
