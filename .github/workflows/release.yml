name: Release

# Stable channel — same shape as JumpStart: tag push → reusable build matrix →
# GitHub Release with installers attached. The website (web/) reads that
# release through the GitHub API, so /download updates itself.
#
#   # bump app/package.json, commit, then:
#   git tag v0.4.1 && git push origin v0.4.1
#
# Notes body: docs/releases/vX.Y.Z.md when present (JumpStart-style format).

on:
  push:
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.4.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: check
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg=$(node -p "require('./app/package.json').version")
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "v$pkg" ]; then
            echo "::error::Tag $tag does not match app/package.json version $pkg."
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          notes="docs/releases/v${VERSION}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            {
              echo "v${VERSION}"
              echo
              echo "Desktop installers for macOS, Windows, and Linux."
              echo
              echo "### Downloads"
              echo
              echo "| Platform | Asset |"
              echo "| --- | --- |"
              echo "| macOS (Apple Silicon) | \`AnyLM-${VERSION}-arm64.dmg\` |"
              echo "| macOS (Intel) | \`AnyLM-${VERSION}.dmg\` |"
              echo "| Windows (x64) | \`AnyLM-${VERSION}-x64-setup.exe\` |"
              echo "| Linux (x64) | \`AnyLM-${VERSION}.AppImage\` |"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/v${VERSION}...${TAG}"
            } > release-notes.md
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}
      version: ${{ needs.verify.outputs.version }}
    secrets: inherit

  finalize:
    name: Merge auto-update feeds
    needs: [verify, build]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release assets and merge manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p artifacts/release dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts/release \
            --pattern 'latest*.yml' \
            --pattern '*.dmg' \
            --pattern '*.zip' \
            --pattern '*.exe' \
            --pattern '*.AppImage' \
            --pattern '*.deb' \
            --pattern '*.blockmap' || true

          if ! ls artifacts/release/latest*.yml >/dev/null 2>&1; then
            echo "No latest*.yml assets yet; skipping merge."
            exit 0
          fi

          npm install --no-save js-yaml
          node app/scripts/merge-update-feeds.js artifacts dist
          if ls dist/latest*.yml >/dev/null 2>&1; then
            gh release upload "$TAG" dist/latest*.yml \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi

          echo "Release assets:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
