name: Release

# Tag a version to build macOS, Windows and Linux installers and publish them
# to GitHub Releases. The marketing site (web/) reads that release through the
# GitHub API, so /download and the homepage button update themselves.
#
#   # bump app/package.json version, then:
#   git tag v0.4.0 && git push origin v0.4.0
#
# Optional notes file: docs/releases/vX.Y.Z.md (used when present).
#
# Assets are uploaded straight to the GitHub Release (no Actions artifacts),
# so packaging is not blocked by artifact storage quota.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.4.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: check
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg=$(node -p "require('./app/package.json').version")
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "v$pkg" ]; then
            echo "::error::Tag $tag does not match app/package.json version $pkg."
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare release shell + notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          notes="docs/releases/v${VERSION}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            {
              echo "## AnyLM v${VERSION}"
              echo
              echo "Desktop installers for **macOS**, **Windows**, and **Linux**."
              echo
              echo "Download from the [AnyLM site](https://anylm.app/download) or the assets below."
            } > release-notes.md
          fi

          {
            echo
            echo "---"
            echo
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq .body 2>/dev/null || true
          } >> release-notes.md || true

          prerelease_args=()
          if [[ "$TAG" == *"-beta"* || "$TAG" == *"-rc"* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AnyLM v${VERSION}" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AnyLM v${VERSION}" \
              --notes-file release-notes.md \
              --verify-tag \
              "${prerelease_args[@]}"
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: mac-arm64
            args: --mac --arm64
          - os: macos-13
            artifact: mac-x64
            args: --mac --x64
          - os: windows-latest
            artifact: windows-x64
            args: --win --x64
          - os: windows-latest
            artifact: windows-ia32
            args: --win --ia32
          - os: ubuntu-latest
            artifact: linux-x64
            args: --linux --x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Rebuild native modules (macOS)
        if: startsWith(matrix.os, 'macos')
        working-directory: app
        run: bunx electron-rebuild -f -w electron-liquid-glass || echo "electron-rebuild failed; electron-builder will rebuild during packaging"

      - name: Build and package
        working-directory: app
        shell: bash
        env:
          ANYLM_FIREBASE_PROJECT: ${{ vars.ANYLM_FIREBASE_PROJECT || secrets.ANYLM_FIREBASE_PROJECT }}
          ANYLM_FIREBASE_API_KEY: ${{ vars.ANYLM_FIREBASE_API_KEY || secrets.ANYLM_FIREBASE_API_KEY }}
          ANYLM_FIREBASE_AUTH_DOMAIN: ${{ vars.ANYLM_FIREBASE_AUTH_DOMAIN || secrets.ANYLM_FIREBASE_AUTH_DOMAIN }}
          ANYLM_SITE_URL: ${{ vars.ANYLM_SITE_URL || secrets.ANYLM_SITE_URL }}
          ANYLM_MS_CLIENT_ID: ${{ vars.ANYLM_MS_CLIENT_ID || secrets.ANYLM_MS_CLIENT_ID }}
          ANYLM_PROXY_PORT: ${{ vars.ANYLM_PROXY_PORT || secrets.ANYLM_PROXY_PORT }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "${ANYLM_FIREBASE_PROJECT:-}" ] || [ -z "${ANYLM_FIREBASE_API_KEY:-}" ]; then
            echo "::error::Set repo Variables ANYLM_FIREBASE_PROJECT and ANYLM_FIREBASE_API_KEY (public Firebase web identifiers)."
            exit 1
          fi

          # Empty CSC_* makes electron-builder treat "" as a cert path and fail
          # with "<projectDir> not a file". Only keep them when actually set.
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi

          bun run build
          bunx electron-builder ${{ matrix.args }} --publish never

      - name: Upload installers to GitHub Release
        shell: bash
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers produced in app/release"
            ls -la release || true
            exit 1
          fi
          echo "Uploading to $TAG:"
          printf '  %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  finalize:
    name: Merge auto-update feeds
    needs: [verify, build]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release assets and merge manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          mkdir -p artifacts/release dist
          # Pull only the update manifests + installers we need to re-merge.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts/release \
            --pattern 'latest*.yml' \
            --pattern '*.dmg' \
            --pattern '*.zip' \
            --pattern '*.exe' \
            --pattern '*.AppImage' \
            --pattern '*.deb' \
            --pattern '*.blockmap' || true

          if ! ls artifacts/release/latest*.yml >/dev/null 2>&1; then
            echo "No latest*.yml assets yet; skipping merge."
            exit 0
          fi

          npm install --no-save js-yaml
          node app/scripts/merge-update-feeds.js artifacts dist
          if ls dist/latest*.yml >/dev/null 2>&1; then
            gh release upload "$TAG" dist/latest*.yml \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi
          echo "Release assets:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
