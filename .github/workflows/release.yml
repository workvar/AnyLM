name: Release

# Tag a version to build macOS, Windows and Linux installers and publish them
# to GitHub Releases. The marketing site (web/) reads that release through the
# GitHub API, so /download and the homepage button update themselves.
#
#   # bump app/package.json version, then:
#   git tag v0.4.0 && git push origin v0.4.0
#
# Optional notes file: docs/releases/vX.Y.Z.md (used when present).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.4.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: check
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg=$(node -p "require('./app/package.json').version")
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "v$pkg" ]; then
            echo "::error::Tag $tag does not match app/package.json version $pkg."
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: mac-arm64
            args: --mac --arm64
          - os: macos-13
            artifact: mac-x64
            args: --mac --x64
          - os: windows-latest
            artifact: windows-x64
            args: --win --x64
          - os: windows-latest
            artifact: windows-ia32
            args: --win --ia32
          - os: ubuntu-latest
            artifact: linux-x64
            args: --linux --x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Rebuild native modules (macOS)
        if: startsWith(matrix.os, 'macos')
        working-directory: app
        run: bunx electron-rebuild -f -w electron-liquid-glass || echo "electron-rebuild failed; electron-builder will rebuild during packaging"

      - name: Build and package
        working-directory: app
        shell: bash
        env:
          ANYLM_FIREBASE_PROJECT: ${{ vars.ANYLM_FIREBASE_PROJECT }}
          ANYLM_FIREBASE_API_KEY: ${{ vars.ANYLM_FIREBASE_API_KEY }}
          ANYLM_FIREBASE_AUTH_DOMAIN: ${{ vars.ANYLM_FIREBASE_AUTH_DOMAIN }}
          ANYLM_SITE_URL: ${{ vars.ANYLM_SITE_URL }}
          ANYLM_MS_CLIENT_ID: ${{ vars.ANYLM_MS_CLIENT_ID }}
          ANYLM_PROXY_PORT: ${{ vars.ANYLM_PROXY_PORT }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] && [ -z "$WIN_CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          bun run build
          bunx electron-builder ${{ matrix.args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          if-no-files-found: error
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.blockmap
            app/release/latest*.yml

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge auto-update manifests and collect installers
        run: |
          npm install --no-save js-yaml
          mkdir -p dist
          node app/scripts/merge-update-feeds.js artifacts dist
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' \) \
            -exec cp {} dist/ \;
          echo "Release assets:"
          ls -la dist

      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          notes="docs/releases/v${VERSION}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          else
            {
              echo "## AnyLM v${VERSION}"
              echo
              echo "Desktop installers for **macOS**, **Windows**, and **Linux**."
              echo
              echo "Download from the [AnyLM site](https://anylm.app/download) or the assets below."
              echo
              echo "### Downloads"
              echo
              echo "| Platform | Recommended |"
              echo "| --- | --- |"
              echo "| macOS (Apple Silicon) | \`.dmg\` arm64 |"
              echo "| macOS (Intel) | \`.dmg\` x64 |"
              echo "| Windows | \`-setup.exe\` |"
              echo "| Linux | \`.AppImage\` |"
            } > release-notes.md
          fi

          # Append auto-generated commit summary when available.
          {
            echo
            echo "---"
            echo
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq .body 2>/dev/null || true
          } >> release-notes.md || true

          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          prerelease_args=()
          if [[ "$TAG" == *"-beta"* || "$TAG" == *"-rc"* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AnyLM v${VERSION}" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AnyLM v${VERSION}" \
              --notes-file release-notes.md \
              --verify-tag \
              "${prerelease_args[@]}"
          fi

          gh release upload "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
