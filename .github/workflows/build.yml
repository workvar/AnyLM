name: Build desktop installers

on:
  push:
    tags:
      - "v*" # tagging a release builds installers + creates a GitHub Release
  workflow_dispatch: {} # manual run from the Actions tab

# Allow the release job to create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One job per (OS, arch) so every requested installer is built separately
      # and bundles the matching Chroma server binary (fetched in beforePack).
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            args: "--mac --arm64"
          - os: macos-latest
            arch: x64
            args: "--mac --x64"
          - os: windows-latest
            arch: x64
            args: "--win --x64"
          - os: windows-latest
            arch: ia32
            args: "--win --ia32"
          - os: ubuntu-latest
            arch: x64
            args: "--linux --x64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Not --frozen-lockfile: dependencies (chromadb) were added after the
        # committed bun.lock, so let bun resolve and refresh it during install.
        run: bun install

      # Safety net: rebuild the native glass module against this Electron's ABI.
      # macOS only; it's the sole native dep and is darwin-only. Non-fatal:
      # electron-builder runs @electron/rebuild itself during packaging, so a
      # failure here must not kill the job.
      - name: Rebuild native modules (macOS)
        if: matrix.os == 'macos-latest'
        run: bunx electron-rebuild -f -w electron-liquid-glass || echo "electron-rebuild failed; electron-builder will rebuild during packaging"

      # Configure code signing ONLY when the cert secret is actually set.
      # An empty CSC_LINK makes electron-builder treat "" as a cert path and
      # crash with "<projectDir> not a file", so we must not export it empty.
      # Add these repo secrets to enable signing:
      #   CSC_LINK (base64 .p12), CSC_KEY_PASSWORD, and for macOS notarization
      #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
      - name: Configure code signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Signing enabled."
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ]; then
              echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            fi
          else
            echo "No signing cert configured; building unsigned."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      # The app is TypeScript now and package.json "main" points at dist/, so
      # the compile has to happen before electron-builder packages anything.
      # ANYLM_FIREBASE_* are project identifiers, not credentials (see
      # app/.env.example), so repo *variables* are the right home for them;
      # secrets are accepted as a fallback for existing setups.
      - name: Compile TypeScript
        env:
          ANYLM_FIREBASE_PROJECT: ${{ vars.ANYLM_FIREBASE_PROJECT || secrets.ANYLM_FIREBASE_PROJECT }}
          ANYLM_FIREBASE_API_KEY: ${{ vars.ANYLM_FIREBASE_API_KEY || secrets.ANYLM_FIREBASE_API_KEY }}
          ANYLM_SITE_URL: ${{ vars.ANYLM_SITE_URL }}
        run: bun run build

      - name: Build installer
        # beforePack downloads the Chroma server binary for this arch and bundles
        # it via extraResources. Never publish from here; we release/upload below.
        # Signing env (if any) comes from the previous step via $GITHUB_ENV.
        run: bunx electron-builder --publish never ${{ matrix.args }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anylm-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/*.yml
          if-no-files-found: ignore

  # Gather every arch's installers and publish one GitHub Release for the tag.
  # The release IS the update feed — electron-updater reads latest*.yml straight
  # from the release assets, so there is no separate hosting to keep in sync.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten every arch's installers into one folder. Duplicate names across
      # artifacts (e.g. builder-debug.yml) collapse to one copy, which is fine.
      - name: Collect installers
        shell: bash
        run: |
          shopt -s globstar nullglob
          mkdir -p release-assets
          for f in artifacts/**/*.{dmg,zip,exe,AppImage,blockmap,yml}; do
            cp -f "$f" release-assets/
          done
          echo "Assets to upload:"
          ls -1 release-assets

      # The copy above lets each arch's latest*.yml overwrite the previous one,
      # which would point every user at whichever arch happened to land last.
      # Re-emit merged manifests that list every arch's installers.
      - name: Check out repo (for the merge script)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Merge per-arch update manifests
        shell: bash
        run: |
          npm install --no-save js-yaml
          node repo/scripts/merge-update-feeds.js artifacts release-assets
          echo "Merged manifests:"
          ls -1 release-assets/*.yml

      # Create the release if it doesn't exist yet, then upload with --clobber.
      # gh uploads sequentially and overwrites existing assets, avoiding the
      # flaky delete+update asset races that fail action-gh-release on re-runs
      # or when the release was created before the workflow ran.
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
