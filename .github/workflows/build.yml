name: Build desktop installers

on:
  push:
    tags:
      - "v*" # tagging a release builds installers + creates a GitHub Release
  workflow_dispatch: {} # manual run from the Actions tab

# Allow the release job to create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One job per (OS, arch) so every requested installer is built separately
      # and bundles the matching Chroma server binary (fetched in beforePack).
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            args: "--mac --arm64"
          - os: macos-latest
            arch: x64
            args: "--mac --x64"
          - os: windows-latest
            arch: x64
            args: "--win --x64"
          - os: windows-latest
            arch: ia32
            args: "--win --ia32"
          - os: ubuntu-latest
            arch: x64
            args: "--linux --x64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Not --frozen-lockfile: dependencies (chromadb) were added after the
        # committed bun.lock, so let bun resolve and refresh it during install.
        run: bun install

      # Safety net: rebuild the native glass module against this Electron's ABI.
      # macOS only; it's the sole native dep and is darwin-only.
      - name: Rebuild native modules (macOS)
        if: matrix.os == 'macos-latest'
        run: bunx electron-rebuild -f -w electron-liquid-glass

      - name: Build installer
        # beforePack downloads the Chroma server binary for this arch and bundles
        # it via extraResources. Never publish from here; we release/upload below.
        #
        # Code signing is gated on secrets: set them and builds sign automatically;
        # leave them empty and builds stay unsigned (CSC_IDENTITY_AUTO_DISCOVERY is
        # 'false' when no cert is present, so the build still completes).
        #   Required secrets to enable signing:
        #     CSC_LINK                    base64 of the code-signing cert (.p12);
        #                                 macOS: "Developer ID Application", Windows: your code-signing cert
        #     CSC_KEY_PASSWORD            password for that .p12
        #   Additional secrets for macOS notarization:
        #     APPLE_ID                    Apple developer account email
        #     APPLE_APP_SPECIFIC_PASSWORD app-specific password for that Apple ID
        #     APPLE_TEAM_ID               your Apple Developer Team ID
        run: bunx electron-builder --publish never ${{ matrix.args }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Only attempt auto-discovery/signing when a cert secret is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anylm-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: ignore

      # Publish the auto-update feed to Cloudflare R2 (only on a tag build).
      - name: Publish update feed to R2
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ENDPOINT" ]; then echo "R2 not configured; skipping"; exit 0; fi
          aws s3 cp dist "s3://$R2_BUCKET/llmeter" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" \
            --include "*.yml" \
            --include "*.dmg" \
            --include "*.zip" \
            --include "*.exe" \
            --include "*.AppImage" \
            --include "*.blockmap"

  # Gather every arch's installers and publish one GitHub Release for the tag.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.blockmap
            artifacts/**/*.yml
